# dsh-tagger（DSh Tagger）：提示词锻造台 · 桌面端优先
# 装好后重启 DSH；面板在左侧栏「标签」图标，也占一个 better-sidebar 页签。
# HTTP 前缀 /tagger/api（旧前缀 /prompt-forge/api 同时兼容）。
- insert:
    - id: tagger
      name: dsh-tagger
      config:
        llm:
          provider: opencode-go
          model: deepseek-v4.1-flash
          maxTokens: 4000
          timeoutMs: 120000
        # 破甲层：forge / refine 共用同一套系统提示词强度。
        purge:
          enabled: true
          level: full
          extraDirectives: []
          injectIntoAgentPrompt: false
        tags:
          standards: [wd, camie]
          maxTags: 40
          weightSyntax: comfy
          chineseAlias: true
        # 二次精修：对已锻造的标签串做增量增删，不重跑整串。
        refine:
          mode: add
          maxNewTags: 12
          temperature: 0.4
          maxTokens: 3000
          timeoutMs: 120000
          keepOrder: true
        comfy:
          baseUrl: http://127.0.0.1:8188
          workflowDir: C:/Users/<你的用户名>/.dsh-comfyui-workbench/workflows
          defaultWorkflowId: ''
          positiveNode: ''
          negativeNode: ''
          pollIntervalMs: 1000
          timeoutMs: 900000
