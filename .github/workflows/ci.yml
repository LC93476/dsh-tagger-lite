# DSh Tagger CI —— 三道门禁：词表结构、类型检查、全量测试。
# 任何一道失败即红；本地等价命令见 README「测试与静态检查」。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # 代码里有大量中文路径与 CRLF 脚本，windows-latest 与开发机一致
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 环境信息
        run: node -v && npm -v && git --version

      - name: 装依赖（只有 typescript / @types/node 两个 devDependency）
        run: npm install --no-audit --no-fund

      - name: 词表结构自检（npm run check:tags）
        run: npm run check:tags

      - name: 类型检查（npm run typecheck）
        run: npm run typecheck

      - name: 全量测试
        env:
          # 真机 ComfyUI 用例靠这个变量跳过；CI 上没有 ComfyUI
          DSH_TAGGER_NO_COMFY: "1"
        # npm test = scripts/run-tests.mjs：串行跑（几个套件会读写同一份词表目录，并行会互相踩）
        # 失败时把失败用例名与断言贴到日志末尾：Actions 的日志查看器是虚拟化的，
        # 中段的 not ok 往往翻不到，末尾这几行才是能直接看到的部分。
        run: |
          set +e
          npm test 2>&1 | tee test-out.txt
          code=${PIPESTATUS[0]}
          echo "test-exit=$code"
          grep -n -A 22 "^not ok" test-out.txt | head -90
          tail -12 test-out.txt
          exit $code
